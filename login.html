<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar Sesión | Álvarez & Landeo Abogados</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="login-left">
        <img src="img/logo.png" alt="Logo Álvarez & Landeo">
        <h1>Álvarez & Landeo</h1>
        <h3>Abogados Especialistas</h3>
        <p>Acceda al sistema para administrar consultas jurídicas y clientes.</p>
    </div>

    <div class="login-right">
        <form id="loginForm" novalidate>
            <h2>Iniciar Sesión</h2>

            <div class="input-box">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
            </div>

            <div class="input-box">
                <label for="password">Contraseña</label>
                <div class="password">
                    <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>
                    <button type="button" id="mostrar" aria-label="Mostrar u ocultar contraseña">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="remember">
                <a href="recuperar.html">¿Olvidó su contraseña?</a>
            </div>

            <button class="btn-login" type="submit" id="btnIngresar">
                <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
                Ingresar
            </button>

            <p id="mensaje" role="alert" aria-live="polite"></p>

            <hr>

            <div class="volver">
                <a href="index.html">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                    Volver al Inicio
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase/conexion.js"></script>

<script>
    const btnMostrar = document.getElementById("mostrar");
    const inputPassword = document.getElementById("password");
    const mensaje = document.getElementById("mensaje");
    const btnIngresar = document.getElementById("btnIngresar");
    const form = document.getElementById("loginForm");

    btnMostrar.addEventListener("click", () => {
        const mostrando = inputPassword.type === "text";
        inputPassword.type = mostrando ? "password" : "text";
        btnMostrar.innerHTML = mostrando
            ? '<i class="fas fa-eye" aria-hidden="true"></i>'
            : '<i class="fas fa-eye-slash" aria-hidden="true"></i>';
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!form.reportValidity()) {
            return;
        }

        const email = document.getElementById("email").value.trim();
        const password = inputPassword.value;

        btnIngresar.disabled = true;
        mensaje.style.color = "";
        mensaje.textContent = "Verificando...";

        try {
            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                mensaje.style.color = "red";
                mensaje.textContent = "Correo o contraseña incorrectos.";
                return;
            }

            mensaje.style.color = "green";
            mensaje.textContent = "Bienvenido...";
            window.location.href = "dashboard.html";
        } catch (err) {
            mensaje.style.color = "red";
            mensaje.textContent = "No se pudo conectar. Intente nuevamente.";
        } finally {
            btnIngresar.disabled = false;
        }
    });
</script>

</body>
</html>
